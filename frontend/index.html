<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ENCOMP Agenda</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <p class="brand">ENCOMP Agenda</p>
        <h1>Eventos</h1>
        <p class="subtitle">Cadastre e gerencie a programação do evento.</p>
      </header>

      <p id="mensagem" class="mensagem" hidden></p>

      <section class="painel" aria-labelledby="form-titulo">
        <h2 id="form-titulo">Novo evento</h2>
        <form id="form-evento">
          <input type="hidden" id="evento-id" value="" />

          <label>
            Título
            <input id="titulo" name="titulo" type="text" required maxlength="120" />
          </label>

          <label>
            Data
            <input id="data" name="data" type="date" required />
          </label>

          <label>
            Local
            <input id="local" name="local" type="text" required maxlength="120" />
          </label>

          <label>
            Status
            <select id="status" name="status">
              <option value="agendado">Agendado</option>
              <option value="em_andamento">Em andamento</option>
              <option value="concluido">Concluído</option>
              <option value="cancelado">Cancelado</option>
            </select>
          </label>

          <label>
            Descrição
            <textarea id="descricao" name="descricao" rows="3" maxlength="500"></textarea>
          </label>

          <div class="acoes-form">
            <button type="submit" id="btn-salvar">Salvar</button>
            <button type="button" id="btn-cancelar" class="secundario" hidden>
              Cancelar edição
            </button>
          </div>
        </form>
      </section>

      <section class="painel" aria-labelledby="lista-titulo">
        <div class="lista-cabecalho">
          <h2 id="lista-titulo">Lista</h2>
          <button type="button" id="btn-atualizar" class="secundario">Atualizar</button>
        </div>
        <div id="lista-estado" class="lista-estado">Carregando...</div>
        <ul id="lista-eventos" class="lista"></ul>
      </section>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
